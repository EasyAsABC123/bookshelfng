name: Make Package Public

permissions:
  packages: write

on:
  workflow_dispatch:

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method PATCH \
            /user/packages/container/bookshelfng/visibility \
            -f visibility=public
